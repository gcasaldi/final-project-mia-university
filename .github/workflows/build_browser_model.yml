name: Train and publish browser ML classifier

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/export_browser_model.py"
      - "scripts/verify_model.mjs"
      - "src/model_service.py"
      - "src/phishing_utils.py"
      - "docs/model-runtime.mjs"
      - ".github/workflows/build_browser_model.yml"

permissions:
  contents: write

concurrency:
  group: build-browser-model
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.0" "scikit-learn>=1.4" "kagglehub[pandas-datasets]>=0.3" "pytest>=8" 
      - name: Verify existing Python tests
        run: python -m pytest -q
      - name: Export V3 model coefficients and held-out metrics
        run: python -m scripts.export_browser_model
      - name: Test browser inference against Python outputs
        run: |
          node --check docs/model-runtime.mjs
          node scripts/verify_model.mjs
      - name: Commit verified public model artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/model.json
          if git diff --cached --quiet; then
            echo "No changes to the model artifact."
          else
            git commit -m "Publish validated client-side V3 classifier"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
